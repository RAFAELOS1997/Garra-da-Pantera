name: Deploy Pagina para Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'pagina/**'
      - 'VERSAO.txt'
      - '.github/workflows/deploy-pagina.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Baixar instalador publicado para o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pagina/downloads
          VERSION="$(tr -d '[:space:]' < VERSAO.txt)"
          for ATTEMPT in $(seq 1 18); do
            if gh release download "v${VERSION}" \
              --pattern '*Installer.exe' \
              --output pagina/downloads/GarraDaPantera-Installer.exe \
              --clobber; then
              break
            fi
            echo "Instalador v${VERSION} ainda não está disponível (tentativa ${ATTEMPT}/18)."
            sleep 10
          done
          test -s pagina/downloads/GarraDaPantera-Installer.exe

      - name: Deploy via FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: pagina/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
