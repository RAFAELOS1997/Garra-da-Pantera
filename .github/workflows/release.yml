name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSAO.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.VERSAO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ler versao
        id: versao
        run: echo "VERSAO=$(cat VERSAO.txt | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Criar ZIP do programa
        run: |
          zip -r garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip . \
            --exclude '*.git*' \
            --exclude '.github/*' \
            --exclude 'testes/*' \
            --exclude '__pycache__/*' \
            --exclude '*.pyc' \
            --exclude '.venv/*' \
            --exclude 'pagina/*' \
            --exclude 'installer/*'

      - name: Gerar checksum SHA-256 do ZIP
        run: |
          sha256sum garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip \
            > garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip.sha256

      - name: Criar ou atualizar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.VERSAO }}
          name: "Garra da Pantera v${{ steps.versao.outputs.VERSAO }}"
          body: |
            ## Download

            | Arquivo | Descricao |
            |---------|-----------|
            | **GarraDaPantera-v${{ steps.versao.outputs.VERSAO }}-Installer.exe** | Instalador Windows (recomendado) |
            | garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip | Arquivos avulsos (avancado) |

            ## Instalacao (Recomendado)

            1. Baixe o arquivo **Installer.exe** acima
            2. Execute como administrador e siga o assistente
            3. O programa sera instalado com atalho na Area de Trabalho
            4. Na primeira abertura, as dependencias Python sao configuradas automaticamente

            ## Instalacao Manual (ZIP)

            1. Extraia o ZIP em qualquer pasta
            2. Execute `setup.ps1` (apenas na primeira vez)
            3. Abra `abrir_programa.bat`

            O programa verifica atualizacoes automaticamente ao iniciar.

            ## Requisitos

            - Windows 10/11 64-bit
            - Python 3.10 ou superior (para instalacao manual; o instalador verifica)
            - GPU NVIDIA recomendada (CUDA); CPU tambem funciona
          files: |
            garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip
            garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip.sha256
          make_latest: true

  build-installer:
    runs-on: windows-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ler versao
        id: versao
        shell: pwsh
        run: |
          $v = (Get-Content VERSAO.txt -Raw).Trim()
          echo "VERSAO=$v" >> $env:GITHUB_OUTPUT

      - name: Preparar pasta do app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\app | Out-Null
          $excluir = @('.git', '.github', 'testes', '__pycache__', '.venv', 'pagina', 'installer')
          Get-ChildItem -Path . -Exclude $excluir | ForEach-Object {
            if ($_.PSIsContainer) {
              Copy-Item $_.FullName -Destination "installer\app\$($_.Name)" -Recurse -Force
            } else {
              Copy-Item $_.FullName -Destination 'installer\app\' -Force
            }
          }
          Get-ChildItem -Path installer\app -Include '__pycache__' -Recurse -Directory | Remove-Item -Recurse -Force
          Get-ChildItem -Path installer\app -Filter '*.pyc' -Recurse | Remove-Item -Force

      - name: Compilar instalador com Inno Setup
        shell: pwsh
        run: |
          $version = "${{ steps.versao.outputs.VERSAO }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup nao encontrado"; exit 1 }
          & $iscc /DAppVersion="$version" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Instalador criado com sucesso!"

      - name: Upload instalador para o Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.VERSAO }}
          files: installer/Output/GarraDaPantera-v${{ steps.versao.outputs.VERSAO }}-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
