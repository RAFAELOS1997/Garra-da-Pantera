name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSAO.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.VERSAO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ler versao
        id: versao
        run: echo "VERSAO=$(cat VERSAO.txt | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Criar ZIP do programa
        run: |
          zip -r garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip . \
            --exclude '*.git*' \
            --exclude '.github/*' \
            --exclude 'testes/*' \
            --exclude '__pycache__/*' \
            --exclude '*.pyc' \
            --exclude '.venv/*' \
            --exclude 'pagina/*' \
            --exclude 'installer/*'

      - name: Gerar checksum SHA-256 do ZIP
        run: |
          sha256sum garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip \
            > garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip.sha256

      - name: Criar ou atualizar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.VERSAO }}
          name: "Garra da Pantera v${{ steps.versao.outputs.VERSAO }}"
          body: |
            ## Download

            | Arquivo | Descricao |
            |---------|-----------|
            | **GarraDaPantera-v${{ steps.versao.outputs.VERSAO }}-Installer.exe** | Instalador Windows (recomendado) — nao precisa de Python instalado |
            | garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}-exe.zip | Versao congelada em pasta, sem instalador (extraia e rode GarraDaPantera.exe) |
            | garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip | Codigo-fonte em Python (avancado, requer Python 3.12) |

            ## Instalacao (Recomendado)

            1. Baixe o arquivo **Installer.exe** acima
            2. Execute como administrador e siga o assistente
            3. O programa sera instalado com atalho na Area de Trabalho e roda direto, sem precisar de Python

            ## Instalacao Manual (ZIP congelado)

            1. Extraia `garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}-exe.zip` em qualquer pasta
            2. Rode `GarraDaPantera.exe`

            O programa verifica atualizacoes automaticamente ao iniciar.

            ## Requisitos

            - Windows 10/11 64-bit
            - GPU NVIDIA recomendada (CUDA); CPU tambem funciona
            - Python so e necessario para a opcao de codigo-fonte (avancado)
          files: |
            garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip
            garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}.zip.sha256
          make_latest: true

  build-installer:
    runs-on: windows-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ler versao
        id: versao
        shell: pwsh
        run: |
          $v = (Get-Content VERSAO.txt -Raw).Trim()
          echo "VERSAO=$v" >> $env:GITHUB_OUTPUT

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias de build
        run: python -m pip install -r requirements-build.txt

      - name: Congelar o app com PyInstaller
        run: pyinstaller garra_da_pantera.spec --noconfirm --clean

      - name: Incluir VERSAO.txt na build congelada
        shell: pwsh
        # atualizador.py le esta copia (ao lado do .exe) para saber a versao
        # instalada; __file__ nao aponta para um caminho real quando congelado.
        run: Copy-Item VERSAO.txt -Destination dist\GarraDaPantera\ -Force

      - name: Preparar pasta do app para o instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\app | Out-Null
          Copy-Item dist\GarraDaPantera\* -Destination installer\app -Recurse -Force

      - name: Compilar instalador com Inno Setup
        shell: pwsh
        run: |
          $version = "${{ steps.versao.outputs.VERSAO }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup nao encontrado"; exit 1 }
          & $iscc /DAppVersion="$version" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Instalador criado com sucesso!"

      - name: Zipar a build congelada (para uso sem instalador e para auto-update)
        shell: pwsh
        run: |
          $version = "${{ steps.versao.outputs.VERSAO }}"
          Compress-Archive -Path dist\GarraDaPantera\* -DestinationPath "garra-da-pantera-v$version-exe.zip"
          $hash = (Get-FileHash "garra-da-pantera-v$version-exe.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  garra-da-pantera-v$version-exe.zip" | Out-File -Encoding ascii "garra-da-pantera-v$version-exe.zip.sha256"

      - name: Upload instalador e build congelada para o Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.VERSAO }}
          files: |
            installer/Output/GarraDaPantera-v${{ steps.versao.outputs.VERSAO }}-Installer.exe
            garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}-exe.zip
            garra-da-pantera-v${{ steps.versao.outputs.VERSAO }}-exe.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
